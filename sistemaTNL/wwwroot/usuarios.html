<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios - The Nazareth Lord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex estructura">

        <!-- El menú lo dibuja layout.js -->
        <div id="menu"></div>

        <main class="contenido p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h1 class="h3 mb-0">Usuarios</h1>
                <button type="button" id="btnNuevo" class="btn btn-primario">+ Nueva cuenta</button>
            </div>

            <div class="card card-body">
                <!-- Filtro: se aplica mientras se escribe -->
                <input id="filtro" type="search" class="form-control mb-3" autocomplete="off"
                       placeholder="Filtrar por usuario, nombre, correo o rol">

                <!-- Mensajes (sin resultados, errores...) -->
                <div id="mensaje"></div>

                <!-- Tabla de cuentas -->
                <div id="resultado" class="table-responsive"></div>
            </div>
        </main>
    </div>

    <!-- ===== Ventana para crear una cuenta ===== -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5">Nueva cuenta de usuario</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="modalMensaje"></div>
                    <form id="formUsuario" novalidate autocomplete="off">

                        <!-- Persona: se busca por cédula (la persona debe estar registrada) -->
                        <div class="mb-3">
                            <label class="form-label" for="campoCedula">Cédula de la persona</label>
                            <input id="campoCedula" class="form-control" maxlength="20" autocomplete="off">
                            <div id="personaEncontrada" class="form-text"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="campoUsuario">Nombre de usuario</label>
                            <input id="campoUsuario" class="form-control" maxlength="50" autocomplete="off">
                            <div class="form-text">Mínimo 3 caracteres.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="campoCorreo">Correo</label>
                            <input id="campoCorreo" type="email" class="form-control" maxlength="150" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="selRol">Rol</label>
                            <select id="selRol" class="form-select">
                                <option value="">Seleccione...</option>
                                <option value="Director">Director</option>
                                <option value="Subdirector">Administrador</option>
                            </select>
                        </div>
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="campoClave">Contraseña inicial</label>
                                <input id="campoClave" type="password" class="form-control" autocomplete="new-password">
                                <div class="form-text">Mínimo 8 caracteres.</div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="campoClave2">Repetir contraseña</label>
                                <input id="campoClave2" type="password" class="form-control" autocomplete="new-password">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardar" class="btn btn-primario">Crear cuenta</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
    // @ts-nocheck   (desactiva la revisión de tipos del editor para este bloque)

    let usuarios = [];             // cuentas traídas del servidor
    let personaElegida = null;     // persona encontrada por cédula: { idPersona, nombreCompleto }
    const modal = new bootstrap.Modal(el('modalUsuario'));

// ---------- Utilidades ----------
// El rol se guarda como "Subdirector", pero en pantalla se muestra como "Administrador"
function nombreRol(rol) {
    return rol === 'Subdirector' ? 'Administrador' : rol;
}
    // Quita acentos y pasa a minúsculas, para filtrar sin distinguir acentos
    function normalizar(t) {
      return (t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function mostrarMensaje(tipo, texto) {
      const caja = el('mensaje');
      caja.replaceChildren();
      if (!tipo) return;
      const d = document.createElement('div');
      d.className = `alert alert-${tipo}`;
      d.textContent = texto;      // textContent: nunca se interpreta como código
      caja.appendChild(d);
    }

    function mensajeModal(tipo, texto) {
      const caja = el('modalMensaje');
      caja.replaceChildren();
      if (!tipo) return;
      const d = document.createElement('div');
      d.className = `alert alert-${tipo}`;
      d.textContent = texto;
      caja.appendChild(d);
    }

    // Estado de la cuenta: Inhabilitada, Bloqueada (por intentos fallidos) o Habilitada
    function etiquetaEstado(u) {
      const s = document.createElement('span');
      if (!u.habilitado) { s.className = 'badge text-bg-secondary'; s.textContent = 'Inhabilitada'; }
      else if (u.bloqueado) {
        const hasta = new Date(u.bloqueadoHasta);
        s.className = 'badge text-bg-warning';
        s.textContent = 'Bloqueada' + (isNaN(hasta) ? '' : ` hasta ${hasta.toLocaleTimeString('es-NI', { timeStyle: 'short' })}`);
      } else { s.className = 'badge text-bg-success'; s.textContent = 'Habilitada'; }
      return s;
    }

    // ---------- Lista ----------
    async function cargarUsuarios() {
      mostrarMensaje('secondary', 'Cargando...');
      const r = await api('/api/usuarios');
      if (!r.ok) { mostrarMensaje('danger', mensajeError(r)); return; }
      usuarios = r.datos;
      mostrarMensaje(null, '');
      dibujar();
    }

    function dibujar() {
      const f = normalizar(el('filtro').value.trim());
      const filas = usuarios.filter((u) =>
          normalizar([u.nombreUsuario, u.nombreCompleto, u.correo, nombreRol(u.rol)].join(' ')).includes(f));

      if (filas.length === 0) {
        el('resultado').replaceChildren();
        mostrarMensaje('warning', usuarios.length === 0 ? 'No hay cuentas registradas.' : 'Ninguna cuenta coincide con el filtro.');
        return;
      }
      mostrarMensaje(null, '');

      const tabla = document.createElement('table');
      tabla.className = 'table table-hover align-middle';
      const cab = tabla.createTHead().insertRow();
      for (const t of ['Usuario', 'Nombre', 'Correo', 'Rol', 'Estado', '']) {
        const th = document.createElement('th');
        th.textContent = t;
        cab.appendChild(th);
      }

      const cuerpo = tabla.createTBody();
      for (const u of filas) {
        const tr = cuerpo.insertRow();
        tr.insertCell().textContent = u.nombreUsuario;
        tr.insertCell().textContent = u.nombreCompleto;
        tr.insertCell().textContent = u.correo;
        tr.insertCell().textContent = nombreRol(u.rol);
        tr.insertCell().appendChild(etiquetaEstado(u));

        const acciones = tr.insertCell();
        acciones.className = 'text-end text-nowrap';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn btn-sm ' + (u.habilitado ? 'btn-outline-danger' : 'btn-outline-success');
        b.textContent = u.habilitado ? 'Inhabilitar' : 'Habilitar';
        b.addEventListener('click', () => cambiarEstado(u, b));
        acciones.appendChild(b);
      }
      const wrap = el('resultado');
      wrap.replaceChildren(tabla);
    }

    // Filtro mientras se escribe (la lista ya está en memoria)
    el('filtro').addEventListener('input', dibujar);

    // ---------- Habilitar / inhabilitar ----------
    async function cambiarEstado(u, boton) {
      if (u.habilitado && !confirm(`¿Inhabilitar la cuenta "${u.nombreUsuario}"? Ya no podrá iniciar sesión.`)) return;

      boton.disabled = true;
      const r = await api(`/api/usuarios/${u.idUsuario}/estado`, { method: 'PUT', body: { habilitado: !u.habilitado } });
      boton.disabled = false;

      // El servidor rechaza, por ejemplo, inhabilitar la propia cuenta
      if (!r.ok) { mostrarMensaje('danger', mensajeError(r)); return; }
      await cargarUsuarios();
      mostrarMensaje('success', `Cuenta "${u.nombreUsuario}" ${u.habilitado ? 'inhabilitada' : 'habilitada'}.`);
    }

    // ---------- Buscar la persona por cédula (mientras se escribe) ----------
    let temporizador = null;
    let contadorBusqueda = 0;      // para ignorar respuestas viejas

    async function buscarPersona() {
      const mi = ++contadorBusqueda;
      const cedula = el('campoCedula').value.trim();
      const caja = el('personaEncontrada');
      personaElegida = null;
      caja.className = 'form-text';
      if (cedula.length < 3) { caja.textContent = ''; return; }

      const r = await api(`/api/personas/buscar?cedula=${encodeURIComponent(cedula)}`);
      if (mi !== contadorBusqueda) return;     // llegó tarde
      if (!r.ok) {
        caja.className = 'form-text text-danger';
        caja.textContent = r.estado === 404
          ? 'No hay una persona registrada con esa cédula. Regístrela primero en Personas y roles.'
          : mensajeError(r);
        return;
      }
      personaElegida = { idPersona: r.datos.idPersona, nombreCompleto: r.datos.nombreCompleto };
      caja.className = 'form-text text-success';
      caja.textContent = `Persona encontrada: ${r.datos.nombreCompleto}`;
    }

    el('campoCedula').addEventListener('input', () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(buscarPersona, 400);
    });

    // ---------- Crear cuenta ----------
    el('btnNuevo').addEventListener('click', () => {
      el('formUsuario').reset();
      el('personaEncontrada').textContent = '';
      personaElegida = null;
      mensajeModal(null, '');
      modal.show();
    });

    el('btnGuardar').addEventListener('click', async () => {
      mensajeModal(null, '');
      const cuerpo = {
        idPersona: personaElegida?.idPersona,
        nombreUsuario: el('campoUsuario').value.trim(),
        correo: el('campoCorreo').value.trim(),
        rol: el('selRol').value,
        contrasena: el('campoClave').value,
      };

      // Validaciones simples (las reglas de unicidad las valida el servidor)
      if (!personaElegida) { mensajeModal('warning', 'Escriba la cédula de una persona registrada.'); return; }
      if (cuerpo.nombreUsuario.length < 3) { mensajeModal('warning', 'El nombre de usuario debe tener al menos 3 caracteres.'); return; }
      if (!cuerpo.correo.includes('@')) { mensajeModal('warning', 'Escriba un correo válido.'); return; }
      if (!cuerpo.rol) { mensajeModal('warning', 'Seleccione el rol.'); return; }
      if (cuerpo.contrasena.length < 8) { mensajeModal('warning', 'La contraseña debe tener al menos 8 caracteres.'); return; }
      if (cuerpo.contrasena !== el('campoClave2').value) { mensajeModal('warning', 'Las contraseñas no coinciden.'); return; }

      const boton = el('btnGuardar');
      boton.disabled = true;
      const r = await api('/api/usuarios', { method: 'POST', body: cuerpo });
      boton.disabled = false;

      if (!r.ok) { mensajeModal('danger', mensajeError(r)); return; }

      modal.hide();
      await cargarUsuarios();
      mostrarMensaje('success', `Cuenta "${cuerpo.nombreUsuario}" creada para ${personaElegida.nombreCompleto}.`);
    });

    // ---------- Inicio ----------
    montarLayout('usuarios.html');
    cargarUsuarios();
    </script>
</body>
</html>
