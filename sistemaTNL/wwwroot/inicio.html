<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio - The Nazareth Lord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex estructura">

        <!-- El menú lo dibuja layout.js -->
        <div id="menu"></div>

        <main class="contenido p-3 p-md-4">
            <h1 class="h3 mb-1">Inicio</h1>
            <p class="text-muted">Resumen de lo que requiere atención.</p>

            <h2 class="h5 mt-4 mb-3">Alertas</h2>
            <div id="alertas">
                <div class="text-muted">Cargando alertas...</div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
            const contenedor = document.getElementById('alertas');

            // Nombre legible de cada tipo de alerta
            const ETIQUETAS = {
              GRUPO_LLENO: 'Grupo lleno',
              GRUPO_BAJO_MINIMO: 'Pocos estudiantes',
              PERIODO_PENDIENTE_CIERRE: 'Cierre pendiente'
            };

            // Consulta /api/alertas y las muestra como una lista
            async function cargarAlertas() {
              if (!contenedor) return;
              const r = await api('/api/alertas');
              contenedor.replaceChildren();

              if (!r.ok) {
                const e = document.createElement('div');
                e.className = 'alert alert-danger';
                e.textContent = mensajeError(r, 'No se pudieron cargar las alertas.');
                contenedor.appendChild(e);
                return;
              }

              const lista = r.datos?.alertas ?? [];
              if (lista.length === 0) {
                const ok = document.createElement('div');
                ok.className = 'alert alert-success';
                ok.textContent = r.datos?.mensaje ?? 'No hay alertas pendientes.';
                contenedor.appendChild(ok);
                return;
              }

              const ul = document.createElement('ul');
              ul.className = 'list-group';
              for (const a of lista) {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex gap-3 align-items-start';

                // La etiqueta es roja si es urgente y amarilla si es un aviso
                const etiqueta = document.createElement('span');
                etiqueta.className = 'badge ' + (a.severidad === 'Urgente' ? 'text-bg-danger' : 'text-bg-warning');
                etiqueta.textContent = ETIQUETAS[a.tipo] ?? a.tipo;

                // textContent (no innerHTML) para que ningún texto de la base se interprete como código
                const texto = document.createElement('span');
                texto.textContent = a.mensaje;

                li.append(etiqueta, texto);
                ul.appendChild(li);
              }
              contenedor.appendChild(ul);
            }

            // Primero el menú y la sesión; después las alertas
            montarLayout('inicio.html').then(cargarAlertas);
    </script>
</body>
</html>
