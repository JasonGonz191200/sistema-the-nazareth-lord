<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - The Nazareth Lord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <div class="login-pagina">

        <!-- Panel de marca -->
        <section class="login-marca">
            <div class="insignia" aria-hidden="true">
                <!-- Libro abierto (dibujo sencillo) -->
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 6.5C10.5 5.2 8.2 4.5 4 4.5v12.8c4.2 0 6.5.7 8 2 1.5-1.3 3.8-2 8-2V4.5c-4.2 0-6.5.7-8 2z" />
                    <path d="M12 6.5v12.8" />
                </svg>
            </div>
            <h1>The Nazareth Lord</h1>
            <p class="subtitulo">Academia de Inglés</p>
            <div class="linea"></div>
            <p>Sistema de matrícula y pagos.</p>
        </section>

        <!-- Formulario -->
        <section class="login-formulario">
            <div class="login-caja">
                <h2 class="h4 mb-1">Bienvenido</h2>
                <p class="text-muted mb-4">Ingrese con su cuenta para continuar.</p>

                <form id="formLogin" novalidate>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input id="usuario" type="text" class="form-control form-control-lg" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-2">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <div class="input-group input-group-lg">
                            <input id="contrasena" type="password" class="form-control" autocomplete="current-password" required>
                            <button id="btnVer" type="button" class="btn btn-outline-secondary" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
                        </div>
                    </div>
                    <div class="text-end mb-3">
                        <a href="recuperar.html" class="small">¿Olvidó su contraseña?</a>
                    </div>

                    <!-- Aquí se muestran los errores (credenciales incorrectas, cuenta bloqueada...) -->
                    <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

                    <button id="btnEntrar" type="submit" class="btn btn-primario btn-lg w-100">Entrar</button>
                </form>
            </div>
        </section>
    </div>

    <script src="js/api.js"></script>
    <script>
            const form = document.getElementById('formLogin');
            const alerta = document.getElementById('alerta');
            const boton = document.getElementById('btnEntrar');
            const campoClave = document.getElementById('contrasena');
            const btnVer = document.getElementById('btnVer');

            // Mostrar u ocultar la contraseña mientras se escribe
            btnVer.addEventListener('click', () => {
              const oculta = campoClave.type === 'password';
              campoClave.type = oculta ? 'text' : 'password';
              btnVer.textContent = oculta ? 'Ocultar' : 'Mostrar';
            });

            form.addEventListener('submit', async (e) => {
              e.preventDefault();
              alerta.classList.add('d-none');

              const nombreUsuario = document.getElementById('usuario').value.trim();
              const contrasena = campoClave.value;

              if (!nombreUsuario || !contrasena) {
                alerta.textContent = 'Escriba su usuario y su contraseña.';
                alerta.classList.remove('d-none');
                return;
              }

              // Evita enviar dos veces mientras espera la respuesta
              boton.disabled = true;
              boton.textContent = 'Entrando...';

              const r = await api('/api/auth/login', {
                method: 'POST',
                body: { nombreUsuario, contrasena },
                sinRedireccion: true          // un 401 aquí significa "credenciales incorrectas", no sesión vencida
              });

              if (r.ok) {
                window.location.href = '/inicio.html';
                return;
              }

              alerta.textContent = mensajeError(r, 'Usuario o contraseña incorrectos.');
              alerta.classList.remove('d-none');
              boton.disabled = false;
              boton.textContent = 'Entrar';
            });
    </script>
</body>
</html>
