<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cursos - The Nazareth Lord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex estructura">

        <!-- El menú lo dibuja layout.js -->
        <div id="menu"></div>

        <main class="contenido p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">Cursos</h1>
                <div class="d-flex gap-2">
                    <a href="periodos.html" class="btn btn-outline-secondary">Ver períodos</a>
                    <button type="button" id="btnNuevo" class="btn btn-primario">+ Nuevo curso</button>
                </div>
            </div>

            <div class="card card-body">
                <!-- Filtro: se aplica mientras se escribe -->
                <input id="filtro" type="search" class="form-control mb-3" autocomplete="off"
                       placeholder="Filtrar por nombre o nivel">

                <!-- Mensajes (sin resultados, errores...) -->
                <div id="mensaje"></div>

                <!-- Tabla de cursos -->
                <div id="resultado" class="table-responsive"></div>
            </div>
        </main>
    </div>

    <!-- ===== Ventana para crear o editar un curso ===== -->
    <div class="modal fade" id="modalCurso" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="modalTitulo">Nuevo curso</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="modalMensaje"></div>
                    <form id="formCurso" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="campoNombre">Nombre del curso</label>
                            <input id="campoNombre" class="form-control" maxlength="150">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="selNivel">Nivel</label>
                            <select id="selNivel" class="form-select"></select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardar" class="btn btn-primario">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
    // @ts-nocheck   (desactiva la revisión de tipos del editor para este bloque)

    let cursos = [];               // todos los cursos traídos del servidor
    let idEditando = null;         // null = se está creando; número = se está editando ese curso
    const modal = new bootstrap.Modal(el('modalCurso'));

    // ---------- Utilidades ----------
    // Quita acentos y pasa a minúsculas, para filtrar sin distinguir acentos
    function normalizar(t) {
      return (t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function mostrarMensaje(tipo, texto) {
      const caja = el('mensaje');
      caja.replaceChildren();
      if (!tipo) return;
      const d = document.createElement('div');
      d.className = `alert alert-${tipo}`;
      d.textContent = texto;      // textContent: nunca se interpreta como código
      caja.appendChild(d);
    }

    function mensajeModal(tipo, texto) {
      const caja = el('modalMensaje');
      caja.replaceChildren();
      if (!tipo) return;
      const d = document.createElement('div');
      d.className = `alert alert-${tipo}`;
      d.textContent = texto;
      caja.appendChild(d);
    }

    // Etiqueta verde "Habilitado" o gris "Inhabilitado"
    function etiquetaEstado(habilitado) {
      const s = document.createElement('span');
      s.className = 'badge ' + (habilitado ? 'text-bg-success' : 'text-bg-secondary');
      s.textContent = habilitado ? 'Habilitado' : 'Inhabilitado';
      return s;
    }

    // ---------- Niveles (para el desplegable) ----------
    async function cargarNiveles() {
      const r = await api('/api/cursos/niveles');
      const sel = el('selNivel');
      sel.replaceChildren();
      const sin = document.createElement('option');
      sin.value = '';
      sin.textContent = '— Sin nivel —';
      sel.appendChild(sin);
      for (const n of (r.ok ? r.datos : [])) {
        const o = document.createElement('option');
        o.value = String(n.idNivel);
        o.textContent = n.nombre;
        sel.appendChild(o);
      }
    }

    // ---------- Lista ----------
    async function cargarCursos() {
      mostrarMensaje('secondary', 'Cargando...');
      const r = await api('/api/cursos');
      if (!r.ok) { mostrarMensaje('danger', mensajeError(r)); return; }
      cursos = r.datos;
      mostrarMensaje(null, '');
      dibujar();
    }

    // Dibuja la tabla aplicando el filtro del cuadro de búsqueda
    function dibujar() {
      const f = normalizar(el('filtro').value.trim());
      const filas = cursos.filter((c) => normalizar(c.nombre + ' ' + (c.nivel ?? '')).includes(f));

      if (filas.length === 0) {
        el('resultado').replaceChildren();
        mostrarMensaje('warning', cursos.length === 0 ? 'Todavía no hay cursos registrados.' : 'Ningún curso coincide con el filtro.');
        return;
      }
      mostrarMensaje(null, '');

      const tabla = document.createElement('table');
      tabla.className = 'table table-hover align-middle';
      const cab = tabla.createTHead().insertRow();
      for (const t of ['Curso', 'Nivel', 'Estado', '']) {
        const th = document.createElement('th');
        th.textContent = t;
        cab.appendChild(th);
      }

      const cuerpo = tabla.createTBody();
      for (const c of filas) {
        const tr = cuerpo.insertRow();
        tr.insertCell().textContent = c.nombre;
        tr.insertCell().textContent = c.nivel ?? '—';
        tr.insertCell().appendChild(etiquetaEstado(c.estado));

        // Botones de la fila
        const acciones = tr.insertCell();
        acciones.className = 'text-end text-nowrap';

        const bEditar = document.createElement('button');
        bEditar.type = 'button';
        bEditar.className = 'btn btn-sm btn-outline-primary me-2';
        bEditar.textContent = 'Editar';
        bEditar.addEventListener('click', () => abrirEdicion(c));

        const bEstado = document.createElement('button');
        bEstado.type = 'button';
        bEstado.className = 'btn btn-sm ' + (c.estado ? 'btn-outline-danger' : 'btn-outline-success');
        bEstado.textContent = c.estado ? 'Inhabilitar' : 'Habilitar';
        bEstado.addEventListener('click', () => cambiarEstado(c, bEstado));

        acciones.append(bEditar, bEstado);
      }
      el('resultado').replaceChildren(tabla);
    }

    // Filtro mientras se escribe (es local: no hace falta esperar, la lista ya está en memoria)
    el('filtro').addEventListener('input', dibujar);

    // ---------- Habilitar / inhabilitar ----------
    async function cambiarEstado(c, boton) {
      if (c.estado && !confirm(`¿Inhabilitar el curso "${c.nombre}"?`)) return;

      boton.disabled = true;
      const r = await api(`/api/cursos/${c.idCurso}/estado`, { method: 'PUT', body: { habilitado: !c.estado } });
      boton.disabled = false;

      // La base puede rechazarlo (RF025: tiene períodos habilitados) y aquí se muestra el motivo
      if (!r.ok) { mostrarMensaje('danger', mensajeError(r)); return; }
      await cargarCursos();
      mostrarMensaje('success', `Curso "${c.nombre}" ${c.estado ? 'inhabilitado' : 'habilitado'}.`);
    }

    // ---------- Crear / editar ----------
    el('btnNuevo').addEventListener('click', () => {
      idEditando = null;
      el('modalTitulo').textContent = 'Nuevo curso';
      el('campoNombre').value = '';
      el('selNivel').value = '';
      mensajeModal(null, '');
      modal.show();
    });

    function abrirEdicion(c) {
      idEditando = c.idCurso;
      el('modalTitulo').textContent = 'Editar curso';
      el('campoNombre').value = c.nombre;
      el('selNivel').value = c.idNivel ? String(c.idNivel) : '';
      mensajeModal(null, '');
      modal.show();
    }

    el('btnGuardar').addEventListener('click', async () => {
      mensajeModal(null, '');
      const nombre = el('campoNombre').value.trim();
      if (!nombre) { mensajeModal('warning', 'El nombre del curso es obligatorio.'); return; }

      const cuerpo = { nombre, idNivel: el('selNivel').value ? Number(el('selNivel').value) : null };
      const boton = el('btnGuardar');
      boton.disabled = true;
      // Si hay un curso en edición se actualiza (PUT); si no, se crea (POST)
      const r = idEditando
        ? await api(`/api/cursos/${idEditando}`, { method: 'PUT', body: cuerpo })
        : await api('/api/cursos', { method: 'POST', body: cuerpo });
      boton.disabled = false;

      if (!r.ok) { mensajeModal('danger', mensajeError(r)); return; }

      modal.hide();
      await cargarCursos();
      mostrarMensaje('success', idEditando ? 'Curso actualizado.' : `Curso "${nombre}" creado.`);
    });

    // ---------- Inicio ----------
    montarLayout('cursos.html');
    cargarNiveles();
    cargarCursos();
    </script>
</body>
</html>
